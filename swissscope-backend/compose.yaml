services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: swissscope
      POSTGRES_PASSWORD: swissscope_local
      POSTGRES_DB: swissscope
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - swissscope_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swissscope -d swissscope"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  swissscope_postgres:
